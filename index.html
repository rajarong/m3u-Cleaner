<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>M3U Processor</title>
    <style>
        * { box-sizing: border-box; }
        body { background:#0a0a0a; color:#fff; font-family: 'Segoe UI', monospace; margin:0; padding:20px; }
        .container { max-width:900px; margin:0 auto; }
        .box { background:#1a1a1a; padding:25px; border-radius:12px; border:1px solid #333; margin-bottom:20px; }
        .box h2 { color:#eab308; margin-top:0; }
        .flex-row { display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
        .flex-row label { color:#aaa; font-size:14px; }
        textarea { width:100%; height:200px; background:#0d0d0d; color:#0f0; border:1px solid #333; padding:15px; border-radius:8px; font-family:monospace; font-size:14px; resize:vertical; outline:none; transition:0.3s; }
        textarea:focus { border-color:#eab308; }
        input[type="text"] { background:#0d0d0d; color:#fff; border:1px solid #333; padding:10px 15px; border-radius:6px; font-family:monospace; font-size:14px; outline:none; flex:1; min-width:200px; }
        input[type="text"]:focus { border-color:#eab308; }
        .btn-group { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
        button { background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; padding:12px 25px; border:none; border-radius:6px; font-size:15px; transition:0.3s; }
        button:hover { background:#1d4ed8; transform:scale(1.02); }
        button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .btn-danger { background:#dc2626; }
        .btn-danger:hover { background:#b91c1c; }
        .btn-success { background:#16a34a; }
        .btn-success:hover { background:#15803d; }
        .btn-outline { background:transparent; border:1px solid #444; color:#ccc; }
        .btn-outline:hover { background:#222; border-color:#eab308; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:#0d0d0d; border-radius:6px; margin-top:10px; color:#aaa; font-size:13px; }
        .status-bar .count { color:#eab308; font-weight:bold; }
        footer { text-align:center; padding:20px 0; color:#444; font-size:13px; border-top:1px solid #222; margin-top:20px; }
        footer a { color:#eab308; text-decoration:none; }
        footer a:hover { text-decoration:underline; }
        .logo-input { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .logo-preview { width:40px; height:40px; border-radius:6px; border:1px solid #333; object-fit:contain; background:#000; }
        @media (max-width:600px) { .box { padding:15px; } .flex-row { flex-direction:column; align-items:stretch; } }
    </style>
</head>
<body>

<div class="container">

    <!-- Main Tool -->
    <div class="box">
        <h2>⚡ M3U Processor</h2>
        <p style="color:#888;font-size:14px;">Paste M3U / JSON / TXT or enter M3U URL</p>

        <!-- Logo Input -->
        <div class="logo-input" style="margin-bottom:12px;">
            <label style="color:#aaa;font-size:13px;">🎯 Custom Logo URL:</label>
            <input type="text" id="logoInput" placeholder="https://example.com/logo.png" value="https://imgur.com/79g2kMA.png" style="flex:1;">
            <img id="logoPreview" class="logo-preview" src="https://imgur.com/79g2kMA.png" alt="logo preview" onerror="this.style.display='none'">
        </div>

        <!-- Input -->
        <textarea id="rawInput" placeholder="Paste your M3U / JSON / TXT data here..."></textarea>

        <!-- Action Buttons -->
        <div class="btn-group">
            <button id="pBtn" onclick="runTask()">⚡ Process</button>
            <button class="btn-outline" onclick="fetchFromURL()">📥 Load from URL</button>
            <button class="btn-outline" onclick="clearAll()">🗑️ Clear All</button>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <span id="statusText">Ready</span>
            <span class="count" id="countText">0 channels</span>
        </div>

        <!-- Output -->
        <textarea id="output" style="margin-top:15px; color:#fff;" placeholder="Result will appear here..." readonly></textarea>

        <!-- Output Buttons -->
        <div class="btn-group">
            <button class="btn-success" id="copyBtn" style="display:none;" onclick="copyOutput()">📋 Copy</button>
            <button class="btn-success" id="downloadBtn" style="display:none;" onclick="downloadM3U()">📥 Download .m3u</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Made with ❤️ by <a href="https://facebook.com/yourpage" target="_blank">Your Name</a> &bull; Private Tool v2.0
    </footer>

</div>

<script>
    // ======================== CONFIG ========================
    const STORAGE_KEY = 'm3u_processor_input';
    const LOGO_KEY = 'm3u_processor_logo';

    // ======================== INIT ========================
    document.addEventListener('DOMContentLoaded', function() {
        // Load saved input
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) document.getElementById('rawInput').value = saved;
        
        // Load saved logo
        const savedLogo = localStorage.getItem(LOGO_KEY);
        if (savedLogo) {
            document.getElementById('logoInput').value = savedLogo;
            document.getElementById('logoPreview').src = savedLogo;
        }
        
        // Auto-process if input exists
        if (saved && saved.trim()) {
            setTimeout(runTask, 300);
        }
    });

    // ======================== MAIN PROCESSOR ========================
    function runTask() {
        const input = document.getElementById('rawInput').value;
        if (!input || !input.trim()) {
            document.getElementById('statusText').textContent = '⚠️ Please enter some data';
            return;
        }

        // Save to localStorage
        localStorage.setItem(STORAGE_KEY, input);

        const btn = document.getElementById('pBtn');
        btn.disabled = true;
        document.getElementById('statusText').textContent = '⏳ Processing...';

        // Use setTimeout to prevent UI freeze
        setTimeout(() => {
            try {
                const result = processData(input);
                document.getElementById('output').value = result.m3u;
                document.getElementById('countText').textContent = result.count + ' channels';
                document.getElementById('statusText').textContent = '✅ Done!';

                // Show buttons
                document.getElementById('copyBtn').style.display = 'inline-block';
                document.getElementById('downloadBtn').style.display = 'inline-block';
            } catch (e) {
                document.getElementById('statusText').textContent = '❌ Error: ' + e.message;
                document.getElementById('output').value = 'Error: ' + e.message;
            }
            btn.disabled = false;
        }, 50);
    }

    // ======================== DATA PROCESSOR ========================
    function processData(input) {
        input = input.trim();
        let lines = [];
        let isJson = false;
        let count = 0;
        const seen = new Set();
        const output = ['#EXTM3U'];
        let channelName = 'Unknown';

        // Get logo
        const logo = document.getElementById('logoInput').value.trim() || 'https://imgur.com/79g2kMA.png';
        localStorage.setItem(LOGO_KEY, logo);
        document.getElementById('logoPreview').src = logo;

        // ---- DETECT FORMAT ----
        // Check if it's JSON
        if (input.startsWith('[') || input.startsWith('{')) {
            try {
                const json = JSON.parse(input);
                const items = Array.isArray(json) ? json : (json.channels || json.items || []);
                if (items.length) {
                    isJson = true;
                    for (const item of items) {
                        const name = item.name || item.channel || item.title || item.label || 'Unknown';
                        let url = item.url || item.link || item.stream || '';
                        // Handle array of URLs
                        if (Array.isArray(url)) url = url[0] || '';
                        if (url && url.startsWith('http')) {
                            const cleanUrl = url.split('?')[0].split('|')[0].trim();
                            if (!seen.has(cleanUrl)) {
                                seen.add(cleanUrl);
                                const cleanName = cleanNameText(name);
                                output.push(`#EXTINF:-1 tvg-logo="${logo}" ,${cleanName}`);
                                output.push(cleanUrl);
                                count++;
                            }
                        }
                    }
                }
            } catch(e) { /* Not JSON, continue */ }
        }

        // ---- If not JSON, process as M3U/TXT ----
        if (!isJson) {
            const rawLines = input.split('\n');
            let currentName = 'Unknown';

            for (let i = 0; i < rawLines.length; i++) {
                let line = rawLines[i].trim();
                if (!line) continue;

                // Check for #EXTINF
                if (line.indexOf('#EXTINF') === 0) {
                    const lastComma = line.lastIndexOf(',');
                    if (lastComma !== -1) {
                        let namePart = line.substring(lastComma + 1).trim();
                        // Extract name from various formats
                        if (namePart.includes('|')) namePart = namePart.split('|')[0].trim();
                        if (namePart.includes(',')) namePart = namePart.split(',')[0].trim();
                        currentName = cleanNameText(namePart) || 'Unknown';
                    }
                    continue;
                }

                // Check for URL
                if (line.indexOf('http') === 0) {
                    const cleanUrl = line.split('?')[0].split('|')[0].trim();
                    if (cleanUrl && !seen.has(cleanUrl)) {
                        seen.add(cleanUrl);
                        const displayName = currentName || 'Unknown';
                        output.push(`#EXTINF:-1 tvg-logo="${logo}" ,${displayName}`);
                        output.push(cleanUrl);
                        count++;
                    }
                    // Reset name after URL (for next channel)
                    currentName = 'Unknown';
                }
            }
        }

        // If still no output, try extracting any http links
        if (count === 0) {
            const urlRegex = /(https?:\/\/[^\s"']+)/g;
            const matches = input.match(urlRegex);
            if (matches) {
                for (const url of matches) {
                    const cleanUrl = url.split('?')[0].split('|')[0].trim();
                    if (!seen.has(cleanUrl)) {
                        seen.add(cleanUrl);
                        output.push(`#EXTINF:-1 tvg-logo="${logo}" ,Stream ${count+1}`);
                        output.push(cleanUrl);
                        count++;
                    }
                }
            }
        }

        if (count === 0) {
            throw new Error('No valid stream URLs found in the input.');
        }

        return { m3u: output.join('\n'), count: count };
    }

    // ======================== HELPER FUNCTIONS ========================
    function cleanNameText(text) {
        if (!text) return 'Unknown';
        // Remove emojis and special characters
        let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '').trim();
        // Remove extra tags
        cleaned = cleaned.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
        // Remove multiple spaces
        cleaned = cleaned.replace(/\s+/g, ' ');
        // Remove leading/trailing symbols
        cleaned = cleaned.replace(/^[^a-zA-Z0-9]+/, '').replace(/[^a-zA-Z0-9]+$/, '');
        return cleaned || 'Unknown';
    }

    // ======================== FETCH FROM URL ========================
    function fetchFromURL() {
        const url = prompt('Enter M3U URL to fetch:', 'https://example.com/playlist.m3u8');
        if (!url) return;
        
        document.getElementById('statusText').textContent = '⏳ Fetching...';
        
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(data => {
                document.getElementById('rawInput').value = data;
                localStorage.setItem(STORAGE_KEY, data);
                document.getElementById('statusText').textContent = '✅ Fetched ' + data.length + ' bytes';
                runTask();
            })
            .catch(err => {
                document.getElementById('statusText').textContent = '❌ Fetch error: ' + err.message;
                alert('Failed to fetch URL: ' + err.message);
            });
    }

    // ======================== COPY OUTPUT ========================
    function copyOutput() {
        const target = document.getElementById('output');
        target.select();
        target.setSelectionRange(0, 99999);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        document.getElementById('statusText').textContent = '✅ Copied to clipboard!';
        setTimeout(() => {
            document.getElementById('statusText').textContent = '✅ Done!';
        }, 1500);
    }

    // ======================== DOWNLOAD M3U ========================
    function downloadM3U() {
        const content = document.getElementById('output').value;
        if (!content) return;
        
        const blob = new Blob([content], { type: 'audio/x-mpegurl' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'playlist_' + new Date().toISOString().slice(0,10) + '.m3u';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        document.getElementById('statusText').textContent = '✅ Downloaded!';
        setTimeout(() => {
            document.getElementById('statusText').textContent = '✅ Done!';
        }, 1500);
    }

    // ======================== CLEAR ALL ========================
    function clearAll() {
        if (!confirm('Clear all data?')) return;
        document.getElementById('rawInput').value = '';
        document.getElementById('output').value = '';
        document.getElementById('countText').textContent = '0 channels';
        document.getElementById('statusText').textContent = 'Cleared';
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        localStorage.removeItem(STORAGE_KEY);
    }

    // ======================== KEYBOARD SHORTCUT ========================
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            runTask();
        }
    });
</script>

</body>
</html>
