<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>System Tool</title>
    <style>
        body { background:#0a0a0a; color:#fff; font-family:monospace; margin:0; padding:20px; text-align:center; }
        .box { background:#1a1a1a; padding:25px; border-radius:10px; max-width:800px; margin:20px auto; border:1px solid #333; }
        textarea { width:100%; height:200px; background:#000; color:#0f0; border:1px solid #444; padding:15px; border-radius:8px; font-family:monospace; margin-bottom:15px; box-sizing:border-box; resize:vertical; outline:none; }
        button { background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; padding:12px 25px; border:none; border-radius:6px; font-size:16px; transition:0.3s; }
        button:hover { background:#1d4ed8; }
        #copyBtn { background:#dc2626; display:none; margin-top:10px; }
        #copyBtn:hover { background:#b91c1c; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color:#eab308;">Flash Processor</h2>
        <textarea id="rawInput" placeholder="Enter source data..."></textarea>
        <button id="pBtn" onclick="runTask()">Process</button>
        <textarea id="output" style="margin-top:20px; color:#fff;" placeholder="Result..." readonly></textarea>
        <button id="copyBtn" onclick="copyAndDestroy()">Copy & Vanish</button>
    </div>

<script>
    function runTask() { 
        var input = document.getElementById("rawInput").value; 
        if(!input || !input.trim()) return; 
        
        var btn = document.getElementById("pBtn");
        btn.disabled = true; 

        var channels = [];

        // Step 1: Try JSON
        try {
            var jsonData = parseJSON(input.trim());
            if (jsonData !== null) {
                channels = grabFromJSON(jsonData);
            }
        } catch(err) {
            // Not JSON, ignore
        }

        // Step 2: Fallback to M3U
        if (channels.length === 0) {
            channels = grabFromM3U(input);
        }

        // Build output
        var out = ["#EXTM3U"];
        for (var i = 0; i < channels.length; i++) {
            out.push('#EXTINF:-1 tvg-logo="https://imgur.com/79g2kMA.png" ,' + channels[i].name);
            out.push(channels[i].url);
        }

        document.getElementById("output").value = out.join("\n"); 
        document.getElementById("copyBtn").style.display = "inline-block"; 
        document.getElementById("rawInput").value = ""; 
        btn.disabled = false;
    } 

    // ==================== JSON PARSE ====================
    function parseJSON(text) {
        // Try 1: Direct
        try {
            var p = JSON.parse(text);
            if (p && typeof p === "object") return p;
        } catch(e) {}

        // Try 2: Find JSON blob inside text  [ ... ] or { ... }
        var start = -1, bracket = "";
        for (var i = 0; i < text.length; i++) {
            if (text[i] === "[" || text[i] === "{") {
                start = i;
                bracket = text[i];
                break;
            }
        }
        if (start >= 0) {
            var end = bracket === "[" ? text.lastIndexOf("]") : text.lastIndexOf("}");
            if (end > start) {
                try {
                    var p2 = JSON.parse(text.substring(start, end + 1));
                    if (p2 && typeof p2 === "object") return p2;
                } catch(e) {}
            }
        }

        // Try 3: NDJSON (one JSON per line)
        var lines = text.split("\n");
        var arr = [];
        for (var j = 0; j < lines.length; j++) {
            var ln = lines[j].trim();
            if (ln && ln.charAt(0) === "{") {
                try {
                    var obj = JSON.parse(ln);
                    if (obj && typeof obj === "object") arr.push(obj);
                } catch(e) {}
            }
        }
        if (arr.length > 0) return arr;

        return null;
    }

    // ==================== JSON SMART EXTRACT ====================
    var NAME_KEYS = ["tvg-name","tvg_name","name","title","channel","label","station",
        "channel-name","channel_name","stream_name","display_name","display",
        "epg_name","ch_name","channelname","stream-name","channel_title",
        "program","show","network","group-title","group_title"];

    var URL_KEYS = ["url","link","stream_url","stream","src","source","uri","file",
        "stream_link","hls","m3u8","path","address","dash","mpd",
        "stream_uri","playback","video_url","video","media","content",
        "stream_source","feed","endpoint"];

    var LOGO_KEYS = ["logo","tvg-logo","tvg_logo","icon","image","thumbnail",
        "poster","img","cover","avatar","picture","thumb","banner"];

    var IMG_EXT_RX = /\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)([?#]|$)/i;
    var URL_RX = /^https?:\/\//i;

    function isUrl(v) {
        return typeof v === "string" && URL_RX.test(v.trim());
    }

    function keyScore(key, list) {
        var lk = (key || "").toLowerCase().replace(/[\s\-_]/g, "");
        for (var i = 0; i < list.length; i++) {
            var p = list[i].replace(/[\s\-_]/g, "");
            if (lk === p) return 1000 - i;
            if (lk.indexOf(p) !== -1) return 500 - i;
        }
        return -1;
    }

    function isLogoUrl(key, val) {
        return keyScore(key, LOGO_KEYS) > 0 || IMG_EXT_RX.test(val);
    }

    function isStreamUrl(key, val) {
        return isUrl(val) && !isLogoUrl(key, val);
    }

    // Collect all leaf strings from any nested object
    function getLeaves(obj, parentKey) {
        var result = [];
        if (obj === null || obj === undefined) return result;
        if (typeof obj === "string") {
            result.push({key: parentKey || "", val: obj});
            return result;
        }
        if (typeof obj === "number" || typeof obj === "boolean") return result;
        if (Array.isArray(obj)) {
            for (var i = 0; i < obj.length; i++) {
                result = result.concat(getLeaves(obj[i], parentKey));
            }
            return result;
        }
        if (typeof obj === "object") {
            var keys = Object.keys(obj);
            for (var j = 0; j < keys.length; j++) {
                result = result.concat(getLeaves(obj[keys[j]], keys[j]));
            }
        }
        return result;
    }

    // From one object, find best channel name + best stream url
    function pickBest(obj, parentKey) {
        var leaves = getLeaves(obj, "");
        var urls = [];
        var names = [];
        for (var i = 0; i < leaves.length; i++) {
            if (isStreamUrl(leaves[i].key, leaves[i].val)) {
                urls.push(leaves[i]);
            } else if (typeof leaves[i].val === "string" && !isUrl(leaves[i].val) && leaves[i].val.trim()) {
                names.push(leaves[i]);
            }
        }
        if (urls.length === 0) return null;

        // Best URL
        var bestUrl = urls[0], bestUS = -99999;
        for (var u = 0; u < urls.length; u++) {
            var s = keyScore(urls[u].key, URL_KEYS);
            if (s > bestUS) { bestUS = s; bestUrl = urls[u]; }
        }

        // Best Name
        var bestName = null, bestNS = -99999;
        for (var n = 0; n < names.length; n++) {
            var ns = keyScore(names[n].key, NAME_KEYS);
            if (ns > bestNS) { bestNS = ns; bestName = names[n].val; }
        }

        return {
            name: (bestName || parentKey || "Unknown").trim(),
            url: bestUrl.val.trim()
        };
    }

    function grabFromJSON(data) {
        var results = [];

        function walk(d, parentKey) {
            if (d === null || d === undefined) return;

            // Array: process each item separately
            if (Array.isArray(d)) {
                for (var i = 0; i < d.length; i++) walk(d[i], parentKey);
                return;
            }

            if (typeof d !== "object") return;

            var keys = Object.keys(d);

            // --- Case A: name->URL map {"CNN":"http://...","BBC":"http://..."} ---
            var urlCount = 0, strCount = 0;
            for (var a = 0; a < keys.length; a++) {
                if (typeof d[keys[a]] === "string") {
                    strCount++;
                    if (isStreamUrl(keys[a], d[keys[a]])) urlCount++;
                }
            }
            if (urlCount > 1 && urlCount >= strCount * 0.5 && strCount >= keys.length * 0.7) {
                for (var b = 0; b < keys.length; b++) {
                    if (typeof d[keys[b]] === "string" && isStreamUrl(keys[b], d[keys[b]])) {
                        results.push({name: keys[b], url: d[keys[b]].trim()});
                    }
                }
                return;
            }

            // --- Case B: object with direct stream URL (single channel) ---
            var hasDirectUrl = false;
            for (var c = 0; c < keys.length; c++) {
                if (typeof d[keys[c]] === "string" && isStreamUrl(keys[c], d[keys[c]])) {
                    hasDirectUrl = true;
                    break;
                }
            }
            if (hasDirectUrl) {
                var entry = pickBest(d, parentKey);
                if (entry) results.push(entry);
                return;
            }

            // --- Case C: container, recurse into children ---
            var before = results.length;
            for (var e = 0; e < keys.length; e++) {
                var val = d[keys[e]];
                if (val === null || typeof val !== "object") continue;

                if (Array.isArray(val)) {
                    for (var f = 0; f < val.length; f++) walk(val[f], keys[e]);
                } else {
                    // Check child for URLs
                    var childLeaves = getLeaves(val, "");
                    var childHasUrl = false;
                    for (var g = 0; g < childLeaves.length; g++) {
                        if (isStreamUrl(childLeaves[g].key, childLeaves[g].val)) {
                            childHasUrl = true;
                            break;
                        }
                    }
                    if (childHasUrl) {
                        var childUrlCount = 0;
                        for (var h = 0; h < childLeaves.length; h++) {
                            if (isStreamUrl(childLeaves[h].key, childLeaves[h].val)) childUrlCount++;
                        }
                        if (childUrlCount <= 3) {
                            var ce = pickBest(val, keys[e]);
                            if (ce) results.push(ce);
                        } else {
                            walk(val, keys[e]);
                        }
                    }
                }
            }

            // Fallback
            if (results.length === before) {
                var fb = pickBest(d, parentKey);
                if (fb) results.push(fb);
            }
        }

        walk(data, null);
        return results;
    }

    // ==================== M3U PARSER (ORIGINAL) ====================
    function grabFromM3U(input) {
        var lines = input.split("\n");
        var channels = [];
        var name = "Unknown";

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#EXTINF") === 0) {
                var last = line.lastIndexOf(",");
                name = (last !== -1) ? line.substring(last + 1).trim() : "Unknown";
            } else if (line.indexOf("http") === 0) {
                var link = line.split('?')[0].split('|')[0];
                channels.push({ name: name, url: link });
            }
        }
        return channels;
    }

    // ==================== COPY & CLEAR ====================
    function copyAndDestroy() { 
        var target = document.getElementById("output"); 
        var source = document.getElementById("rawInput");
        
        target.select(); 
        target.setSelectionRange(0, 99999);
        document.execCommand("copy"); 
        
        window.getSelection().removeAllRanges();
        
        target.value = ""; 
        source.value = ""; 
        document.getElementById("copyBtn").style.display = "none";
        
        console.log("Memory Cleared.");
    }
</script>

</body>
</html>
