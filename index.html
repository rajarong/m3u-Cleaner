<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>System Tool</title>
    <style>
        body { background:#0a0a0a; color:#fff; font-family:monospace; margin:0; padding:20px; text-align:center; }
        .box { background:#1a1a1a; padding:25px; border-radius:10px; max-width:800px; margin:20px auto; border:1px solid #333; }
        textarea { width:100%; height:200px; background:#000; color:#0f0; border:1px solid #444; padding:15px; border-radius:8px; font-family:monospace; margin-bottom:15px; box-sizing:border-box; resize:vertical; outline:none; }
        button { background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; padding:12px 25px; border:none; border-radius:6px; font-size:16px; transition:0.3s; }
        button:hover { background:#1d4ed8; }
        #copyBtn { background:#dc2626; display:none; margin-top:10px; }
        #copyBtn:hover { background:#b91c1c; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color:#eab308;">Flash Processor</h2>
        <textarea id="rawInput" placeholder="Enter source data..."></textarea>
        <button id="pBtn" onclick="runTask()">Process</button>
        <textarea id="output" style="margin-top:20px; color:#fff;" placeholder="Result..." readonly></textarea>
        <button id="copyBtn" onclick="copyAndDestroy()">Copy & Vanish</button>
    </div>

<script>
    function runTask() { 
        var input = document.getElementById("rawInput").value; 
        if(!input || !input.trim()) return; 
        
        var btn = document.getElementById("pBtn");
        btn.disabled = true; 

        var channels = [];

        // Strategy 1: Try pure JSON
        channels = tryJSON(input.trim());

        // Strategy 2: Try JS/TS object extraction (handles comments, unquoted keys, etc.)
        if (channels.length === 0) {
            channels = tryJSObjects(input);
        }

        // Strategy 3: Fallback M3U
        if (channels.length === 0) {
            channels = tryM3U(input);
        }

        // Build M3U output
        var out = ["#EXTM3U"];
        for (var i = 0; i < channels.length; i++) {
            out.push('#EXTINF:-1 tvg-logo="https://imgur.com/79g2kMA.png" ,' + channels[i].name);
            out.push(channels[i].url);
        }

        document.getElementById("output").value = out.join("\n"); 
        document.getElementById("copyBtn").style.display = "inline-block"; 
        document.getElementById("rawInput").value = ""; 
        btn.disabled = false;
    } 

    /* ═══════════════════════════════════════════════
       STRATEGY 1: Pure JSON
    ═══════════════════════════════════════════════ */
    function tryJSON(text) {
        var data = null;

        // Direct parse
        try {
            var p = JSON.parse(text);
            if (p && typeof p === "object") data = p;
        } catch(e) {}

        // Find [...] or {...} blob
        if (!data) {
            var s = -1, b = "";
            for (var i = 0; i < text.length; i++) {
                if (text[i] === "[" || text[i] === "{") { s = i; b = text[i]; break; }
            }
            if (s >= 0) {
                var e2 = (b === "[") ? text.lastIndexOf("]") : text.lastIndexOf("}");
                if (e2 > s) {
                    try {
                        var p2 = JSON.parse(text.substring(s, e2 + 1));
                        if (p2 && typeof p2 === "object") data = p2;
                    } catch(ex) {}
                }
            }
        }

        // NDJSON
        if (!data) {
            var lines = text.split("\n"), arr = [];
            for (var j = 0; j < lines.length; j++) {
                var ln = lines[j].trim();
                if (ln && ln.charAt(0) === "{") {
                    try {
                        var obj = JSON.parse(ln);
                        if (obj && typeof obj === "object") arr.push(obj);
                    } catch(ex2) {}
                }
            }
            if (arr.length > 0) data = arr;
        }

        if (!data) return [];
        return walkJSON(data, null);
    }

    /* --- JSON recursive walker --- */
    var NAME_PAT = ["tvg-name","tvg_name","name","title","channel","label","station",
        "channel-name","channel_name","stream_name","display_name","ch_name","channelname"];
    var URL_PAT = ["url","link","stream_url","stream","src","source","uri","file",
        "stream_link","hls","m3u8","path","address","video_url","media","content","endpoint"];
    var LOGO_PAT = ["logo","tvg-logo","tvg_logo","icon","image","thumbnail","poster",
        "img","cover","avatar","picture","thumb","banner"];
    var IMG_RX = /\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)([?#]|$)/i;
    var HTTP_RX = /^https?:\/\//i;

    function isUrl(v) { return typeof v === "string" && HTTP_RX.test(v.trim()); }
    function kScore(key, list) {
        var lk = (key||"").toLowerCase().replace(/[\s\-_]/g,"");
        for (var i=0;i<list.length;i++) {
            var p = list[i].replace(/[\s\-_]/g,"");
            if (lk===p) return 1000-i;
            if (lk.indexOf(p)!==-1) return 500-i;
        }
        return -1;
    }
    function isLogo(k,v) { return kScore(k,LOGO_PAT)>0 || IMG_RX.test(v); }
    function isStream(k,v) { return isUrl(v) && !isLogo(k,v); }

    function flatL(obj,pk) {
        var r=[];
        if(obj==null) return r;
        if(typeof obj==="string"){ r.push({k:pk||"",v:obj}); return r; }
        if(typeof obj==="number"||typeof obj==="boolean") return r;
        if(Array.isArray(obj)){ for(var i=0;i<obj.length;i++) r=r.concat(flatL(obj[i],pk)); return r; }
        if(typeof obj==="object"){ var ks=Object.keys(obj); for(var j=0;j<ks.length;j++) r=r.concat(flatL(obj[ks[j]],ks[j])); }
        return r;
    }

    function pickOne(obj,pk) {
        var lv=flatL(obj,""), urls=[], names=[];
        for(var i=0;i<lv.length;i++){
            if(isStream(lv[i].k,lv[i].v)) urls.push(lv[i]);
            else if(typeof lv[i].v==="string"&&!isUrl(lv[i].v)&&lv[i].v.trim()) names.push(lv[i]);
        }
        if(urls.length===0) return null;
        var bu=urls[0],bs=-99999;
        for(var u=0;u<urls.length;u++){var s=kScore(urls[u].k,URL_PAT);if(s>bs){bs=s;bu=urls[u];}}
        var bn=null,bns=-99999;
        for(var n=0;n<names.length;n++){var ns=kScore(names[n].k,NAME_PAT);if(ns>bns){bns=ns;bn=names[n].v;}}
        return {name:(bn||pk||"Unknown").trim(), url:bu.v.trim()};
    }

    function walkJSON(d,pk) {
        var res=[];
        if(Array.isArray(d)){ for(var i=0;i<d.length;i++) res=res.concat(walkJSON(d[i],pk)); return res; }
        if(d===null||typeof d!=="object") return res;
        var ks=Object.keys(d);
        // Case A: name->URL map
        var uc=0,sc=0;
        for(var a=0;a<ks.length;a++){if(typeof d[ks[a]]==="string"){sc++;if(isStream(ks[a],d[ks[a]]))uc++;}}
        if(uc>1&&uc>=sc*0.5&&sc>=ks.length*0.7){
            for(var b=0;b<ks.length;b++){if(typeof d[ks[b]]==="string"&&isStream(ks[b],d[ks[b]]))res.push({name:ks[b],url:d[ks[b]].trim()});}
            return res;
        }
        // Case B: direct URL
        var hd=false;
        for(var c=0;c<ks.length;c++){if(typeof d[ks[c]]==="string"&&isStream(ks[c],d[ks[c]])){hd=true;break;}}
        if(hd){var e=pickOne(d,pk);if(e)res.push(e);return res;}
        // Case C: recurse
        var bf=res.length;
        for(var f=0;f<ks.length;f++){
            var v=d[ks[f]];
            if(v===null||typeof v!=="object") continue;
            if(Array.isArray(v)){for(var g=0;g<v.length;g++) res=res.concat(walkJSON(v[g],ks[f]));}
            else{var cl=flatL(v,""),ch=false;for(var h=0;h<cl.length;h++){if(isStream(cl[h].k,cl[h].v)){ch=true;break;}}
                if(ch){var cu=0;for(var m=0;m<cl.length;m++){if(isStream(cl[m].k,cl[m].v))cu++;}
                    if(cu<=3){var ce=pickOne(v,ks[f]);if(ce)res.push(ce);}else res=res.concat(walkJSON(v,ks[f]));}}
        }
        if(res.length===bf){var fb=pickOne(d,pk);if(fb)res.push(fb);}
        return res;
    }

    /* ═══════════════════════════════════════════════
       STRATEGY 2: JS/TS Object Regex Extraction
       Handles: comments, unquoted keys, trailing
       commas, TypeScript types, template literals
    ═══════════════════════════════════════════════ */
    function tryJSObjects(text) {
        var results = [];

        // Step 1: Remove comments
        var clean = text
            .replace(/\/\*[\s\S]*?\*\//g, "")   // /* ... */
            .replace(/\/\/.*$/gm, "");            // // ...

        // Step 2: Find all { ... } blocks (non-nested — channel objects are flat)
        var blocks = [];
        var depth = 0, start = -1;
        for (var i = 0; i < clean.length; i++) {
            if (clean[i] === "{") {
                if (depth === 0) start = i;
                depth++;
            } else if (clean[i] === "}") {
                depth--;
                if (depth === 0 && start >= 0) {
                    blocks.push(clean.substring(start, i + 1));
                    start = -1;
                }
                if (depth < 0) depth = 0;
            }
        }

        // Step 3: From each block, extract name + url using regex
        // Supports: key: "val", key: 'val', "key": "val"
        var nameRx = /["']?(name|title|channel|label|station|display_name|ch_name|channelname|stream[_-]?name|tvg[_-]?name)["']?\s*[:=]\s*["'`]([^"'`]+)["'`]/i;
        var urlRx  = /["']?(url|link|stream_?url|stream|src|source|uri|stream_?link|video_?url|media|endpoint|address|file|path|hls|m3u8|feed|content|playback)["']?\s*[:=]\s*["'`](https?:\/\/[^"'`\s]+)["'`]/i;

        for (var j = 0; j < blocks.length; j++) {
            var block = blocks[j];
            var nm = nameRx.exec(block);
            var ur = urlRx.exec(block);

            if (ur) {
                var chName = nm ? nm[2].trim() : "Unknown";
                var chUrl  = ur[2].trim();

                // Skip if URL looks like a logo/image
                if (IMG_RX.test(chUrl)) continue;

                results.push({ name: chName, url: chUrl });
            }
        }

        return results;
    }

    /* ═══════════════════════════════════════════════
       STRATEGY 3: M3U Parser (original logic)
    ═══════════════════════════════════════════════ */
    function tryM3U(input) {
        var lines = input.split("\n");
        var channels = [];
        var name = "Unknown";

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#EXTINF") === 0) {
                var last = line.lastIndexOf(",");
                name = (last !== -1) ? line.substring(last + 1).trim() : "Unknown";
            } else if (line.indexOf("http") === 0) {
                var link = line.split('?')[0].split('|')[0];
                channels.push({ name: name, url: link });
            }
        }
        return channels;
    }

    /* ═══════════════════════════════════════════════
       COPY & CLEAR (original)
    ═══════════════════════════════════════════════ */
    function copyAndDestroy() { 
        var target = document.getElementById("output"); 
        var source = document.getElementById("rawInput");
        
        target.select(); 
        target.setSelectionRange(0, 99999);
        document.execCommand("copy"); 
        
        window.getSelection().removeAllRanges();
        
        target.value = ""; 
        source.value = ""; 
        document.getElementById("copyBtn").style.display = "none";
        
        console.log("Memory Cleared.");
    }
</script>

</body>
</html>
