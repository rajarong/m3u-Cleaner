<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google & Search Engine Indexing Blocked -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">

    <title>Flash Processor | Protected Access</title>

    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    
    <style>
        /* পাসওয়ার্ড না দেওয়া পর্যন্ত পুরো বডি লুকানো থাকবে */
        body { 
            display: none; 
            background:#0a0a0a; 
            color:#fff; 
            font-family:monospace; 
            margin:0; 
            padding:20px; 
            text-align:center; 
        }
        .box { background:#1a1a1a; padding:25px; border-radius:10px; max-width:800px; margin:20px auto; border:1px solid #333; }
        textarea { width:100%; height:180px; background:#000; color:#0f0; border:1px solid #444; padding:15px; border-radius:8px; font-family:monospace; margin-bottom:15px; box-sizing:border-box; resize:vertical; outline:none; }
        button { background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; padding:12px 25px; border:none; border-radius:6px; font-size:16px; transition:0.3s; width:100%; }
        button:hover { background:#1d4ed8; }
        #copyBtn { background:#dc2626; display:none; margin-top:10px; }
        #copyBtn:hover { background:#b91c1c; }
        .block-label { color:#eab308; text-align:left; display:block; margin-bottom:5px; font-size:13px; }
    </style>

    <script>
        // পাসওয়ার্ড সিকিউরিটি চেক
        (function checkAccess() {
            var password = prompt("Enter Password to Access:");
            if (password === "iptv2026") {
                window.addEventListener("DOMContentLoaded", function() {
                    document.body.style.display = "block";
                    loadBlockedLogos(); // পেজ লোড হওয়ার পর সেভ করা ব্লকলিস্ট ফিরিয়ে আনা
                });
            } else {
                alert("Incorrect Password!");
                window.location.reload(); // ভুল পাসওয়ার্ড দিলে আবার রিফ্রেশ হবে
            }
        })();

        // সেভ করা ব্লকলিস্ট লোড করা
        function loadBlockedLogos() {
            var savedLogos = localStorage.getItem("saved_blocked_logos");
            if (savedLogos) {
                document.getElementById("blockedLogos").value = savedLogos;
            }
        }

        // নতুন কিছু লিখলে তা লোকাল স্টোরেজে স্বয়ংক্রিয়ভাবে সেভ হবে
        function saveBlockedLogos() {
            var content = document.getElementById("blockedLogos").value;
            localStorage.setItem("saved_blocked_logos", content);
        }
    </script>
</head>
<body>

    <div class="box">
        <h2 style="color:#eab308;">Flash Processor</h2>
        
        <textarea id="rawInput" placeholder="Enter source data..."></textarea>
        
        <!-- লোগো ব্লকলিস্ট ফিল্ড (oninput দিয়ে অটো সেভ হচ্ছে) -->
        <label class="block-label">Logo Blocklist (One URL per line):</label>
        <textarea id="blockedLogos" oninput="saveBlockedLogos()" style="height:80px; color:#ff9800;" placeholder="Paste unwanted logo URLs to replace with default..."></textarea>

        <button id="pBtn" onclick="runTask()">Process</button>
        
        <textarea id="output" style="margin-top:20px; color:#fff;" placeholder="Result..." readonly></textarea>
        <button id="copyBtn" onclick="copyAndDestroy()">Copy & Vanish</button>
    </div>

<script>
    var DEFAULT_LOGO = "https://imgur.com/79g2kMA.png";

    // HTML ট্যাগ যেমন <b>, </b> পরিষ্কার করার ফাংশন
    function cleanName(str) {
        if (!str) return "Unknown";
        return str.replace(/<\/?[^>]+(>|$)/g, "").trim();
    }

    // লোগো ইউআরএল ঠিক আছে কি না তা যাচাই করার ফাংশন
    function isValidLogoUrl(url) {
        if (!url || typeof url !== "string") return false;
        url = url.trim();
        if (!HTTP_RX.test(url)) return false;
        if (url.length > 120) return false;
        if (/[<>{}\\]/.test(url)) return false;
        return true;
    }

    // ব্লকলিস্ট যাচাই করার ফাংশন
    function isBlockedLogo(url) {
        var blockedText = document.getElementById("blockedLogos").value.trim();
        if (!blockedText || !url) return false;
        
        var targetUrl = url.trim().toLowerCase();
        var list = blockedText.split(/\r?\n/);
        
        for (var i = 0; i < list.length; i++) {
            var blockedUrl = list[i].trim().toLowerCase();
            if (blockedUrl !== "") {
                if (targetUrl === blockedUrl || targetUrl.indexOf(blockedUrl) !== -1 || blockedUrl.indexOf(targetUrl) !== -1) {
                    return true;
                }
            }
        }
        return false;
    }

    // .mpd লিংক চেক করার ফাংশন
    function isMpdUrl(url) {
        if (!url || typeof url !== "string") return false;
        return /\.mpd([?#]|$)/i.test(url);
    }

    var NAME_PAT = ["tvg-name","tvg_name","name","title","channel","label","station",
        "channel-name","channel_name","stream_name","display_name","ch_name","channelname"];
    var URL_PAT = ["url","link","stream_url","stream","src","source","uri","file",
        "stream_link","hls","m3u8","path","address","video_url","media","content","endpoint"];
    var LOGO_PAT = ["logo","tvg-logo","tvg_logo","icon","image","thumbnail","poster",
        "img","cover","avatar","picture","thumb","banner"];
    var IMG_RX = /\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)([?#]|$)/i;
    var HTTP_RX = /^https?:\/\//i;

    function runTask() { 
        var input = document.getElementById("rawInput").value; 
        if(!input || !input.trim()) return; 
        
        var btn = document.getElementById("pBtn");
        btn.disabled = true; 

        var channels = [];

        // সরাসরি শক্তিশালী ইউনিভার্সাল পার্সার ব্যবহার করা হচ্ছে (কোনো চ্যানেল বাদ যাবে না)
        channels = tryUniversalParser(input);

        // যদি কোনো কারণে ফাঁকা থাকে তবে ফলব্যাক M3U চেক করা
        if (channels.length === 0) {
            channels = tryM3U(input);
        }

        // Build M3U output
        var out = [
            "#EXTM3U",
            "#EXT-X-PROVIDER:skym3u.dev",
            "#EXT-X-URL:https://skym3u.dev/"
        ];

        for (var i = 0; i < channels.length; i++) {
            var logoUrl = channels[i].logo;

            if (!isValidLogoUrl(logoUrl) || isBlockedLogo(logoUrl)) {
                logoUrl = DEFAULT_LOGO;
            }

            // নাম থেকে HTML ট্যাগগুলো রিমুভ করা হচ্ছে
            var chName = cleanName(channels[i].name);

            out.push('#EXTINF:-1 tvg-name="' + chName + '" tvg-logo="' + logoUrl + '?ref=skym3u.dev" provider="skym3u.dev",' + chName);
            out.push(channels[i].url + '#skym3u.dev');
        }

        document.getElementById("output").value = out.join("\n"); 
        document.getElementById("copyBtn").style.display = "inline-block"; 
        document.getElementById("rawInput").value = ""; 
        btn.disabled = false;
    } 

    /* ═══════════════════════════════════════════════
       UNIVERSAL GLOBAL PARSER (Ensures 100% channel extraction without dropping)
    ═══════════════════════════════════════════════ */
    function tryUniversalParser(text) {
        var results = [];
        var clean = text.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "");

        var blocks = clean.split(/[{}[\]]/);
        
        var nameRx = /["']?(name|title|channel|label|station|display_name|ch_name|channelname|stream[_-]?name|tvg[_-]?name)["']?\s*[:=]\s*["'`]([^"'`]+)["'`]/i;
        var urlRx  = /["']?(url|link|stream_?url|stream|src|source|uri|stream_?link|video_?url|media|endpoint|address|file|path|hls|m3u8|feed|content|playback)["']?\s*[:=]\s*["'`](https?:\/\/[^"'`\s,;}]+)["'`]/i;
        var logoRx = /["']?(logo|tvg[_-]?logo|icon|image|thumbnail|poster|img|cover)["']?\s*[:=]\s*["'`](https?:\/\/[^"'`\s,;}]+)["'`]/i;

        var globalUrlRx = /["']?(https?:\/\/[^"'`\s,;{}]+)["']/g;

        for (var j = 0; j < blocks.length; j++) {
            var block = blocks[j];
            var ur = urlRx.exec(block);

            if (ur) {
                var chUrl = ur[2].trim();
                if (isMpdUrl(chUrl)) continue;
                if (IMG_RX.test(chUrl)) continue;

                var nm = nameRx.exec(block);
                var lg = logoRx.exec(block);

                var chName = nm ? nm[2].trim() : "Unknown";
                var chLogo = lg ? lg[2].trim() : null;

                if (!results.some(function(item) { return item.url === chUrl; })) {
                    results.push({ name: chName, url: chUrl, logo: chLogo });
                }
            }
        }

        var match;
        while ((match = globalUrlRx.exec(clean)) !== null) {
            var directUrl = match[1].trim();
            if (isMpdUrl(directUrl)) continue;
            if (IMG_RX.test(directUrl)) continue;
            if (!HTTP_RX.test(directUrl)) continue;

            if (!results.some(function(item) { return item.url === directUrl; })) {
                results.push({ name: "Channel " + (results.length + 1), url: directUrl, logo: null });
            }
        }

        return results;
    }

    /* ═══════════════════════════════════════════════
       STRATEGY 3: M3U Parser
    ═══════════════════════════════════════════════ */
    function tryM3U(input) {
        var lines = input.split("\n");
        var channels = [];
        var name = "Unknown";
        var logo = null;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#EXTINF") === 0) {
                var last = line.lastIndexOf(",");
                name = (last !== -1) ? line.substring(last + 1).trim() : "Unknown";

                var logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                if (logoMatch) {
                    logo = logoMatch[1];
                }
            } else if (line.indexOf("http") === 0) {
                var link = line.split('?')[0].split('|')[0];
                
                if (!isMpdUrl(link)) {
                    channels.push({ name: name, url: link, logo: logo });
                }
                
                name = "Unknown";
                logo = null;
            }
        }
        return channels;
    }

    /* ═══════════════════════════════════════════════
       COPY & CLEAR
    ═══════════════════════════════════════════════ */
    function copyAndDestroy() { 
        var target = document.getElementById("output"); 
        var source = document.getElementById("rawInput");
        
        target.select(); 
        target.setSelectionRange(0, 99999);
        document.execCommand("copy"); 
        
        window.getSelection().removeAllRanges();
        
        target.value = ""; 
        source.value = ""; 
        document.getElementById("copyBtn").style.display = "none";
        
        console.log("Memory Cleared.");
    }
</script>

</body>
</html>
