<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Titan M3U Flash - Pro Cleaner</title>
    <style>
        body { background:#111; color:#fff; font-family:sans-serif; padding:20px; text-align:center; } 
        .box { background:#222; padding:25px; border-radius:10px; max-width:800px; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid #333; } 
        textarea { width:100%; height:200px; background:#1a1a1a; color:#4ade80; border:1px solid #444; padding:15px; border-radius:8px; font-family:monospace; margin-bottom:15px; box-sizing:border-box; resize:vertical; } 
        button { background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; padding:12px 25px; border:none; border-radius:6px; font-size:16px; transition:0.3s; } 
        button:hover { background:#1d4ed8; } 
        button:disabled { background:#555; cursor:not-allowed; } 
        #copyBtn { background:#16a34a; display:none; margin-top:10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>⚡ Titan M3U Flash</h2>
    <p style="color:#aaa;">Fastest Offline M3U Cleaner & Token Remover</p>
    
    <textarea id="rawInput" placeholder="Paste your messy M3U text here..."></textarea>
    <button id="btn" onclick="startCleaning()">🧹 Clean Instantly</button>
    <textarea id="output" style="margin-top:20px; color:#fff;" placeholder="Ultra-clean playlist will appear here..." readonly></textarea>
    <button id="copyBtn" onclick="copyResult()">📋 Copy Output</button>
</div>

<script>
    function startCleaning() { 
        var input = document.getElementById("rawInput").value; 
        if(!input){ alert("Please paste raw M3U text first!"); return; } 
        
        document.getElementById("btn").disabled = true; 
        document.getElementById("btn").innerText = "Cleaning..."; 

        // ব্রাউজার যাতে হ্যাং না করে তাই ছোট্ট একটা ডিলে দিয়ে কাজটা করানো হচ্ছে
        setTimeout(function() {
            var lines = input.split("\n");
            var outputLines = ["#EXTM3U"];
            var currentName = "Unknown Channel";

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                
                // চ্যানেলের নাম বের করা
                if (line.indexOf("#EXTINF") === 0) {
                    var lastComma = line.lastIndexOf(",");
                    currentName = (lastComma !== -1) ? line.substring(lastComma + 1).trim() : "Unknown Channel";
                } 
                // লিংকের টোকেন পরিষ্কার করা
                else if (line.indexOf("http") === 0) {
                    // '?' এবং '|' এর পরের সব কিছু (টোকেন/প্যারামিটার) কেটে ফেলে মূল লিংকটা রাখবে
                    var cleanLink = line.split('?')[0].split('|')[0];
                    
                    outputLines.push("#EXTINF:-1 ," + currentName);
                    outputLines.push(cleanLink);
                }
            }
            
            // রেজাল্ট দেখানো
            document.getElementById("output").value = outputLines.join("\n"); 
            document.getElementById("btn").innerText = "🧹 Clean Instantly"; 
            document.getElementById("btn").disabled = false; 
            document.getElementById("copyBtn").style.display = "inline-block"; 
        }, 50);
    } 

    function copyResult() { 
        var out = document.getElementById("output"); 
        out.select(); 
        document.execCommand("copy"); 
        alert("Copied successfully!"); 
    }
</script>

</body>
</html>
