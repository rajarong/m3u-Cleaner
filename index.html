    /* ============================

    function tryParseJSON(input) {
        // Direct parse
        try {
            const p = JSON.parse(input);
            if (typeof p === 'object' && p !== null) return p;
        } catch(e) {}

        // Strip JS wrappers:  var x = [...];  or  export default {...}
        const stripped = input
            .replace(/^[\s\S]*?=\s*/, '')       // var x = ...
            .replace(/^export\s+default\s+/, '') // export default ...
            .replace(/;\s*$/, '');               // trailing ;
        try {
            const p = JSON.parse(stripped);
            if (typeof p === 'object' && p !== null) return p;
        } catch(e) {}

        // Find largest JSON blob in text
        const m = input.match(/[\[{][\s\S]*[\]}]/);
        if (m) {
            try {
                const p = JSON.parse(m[0]);
                if (typeof p === 'object' && p !== null) return p;
            } catch(e) {}
        }

        // NDJSON — one JSON object per line
        const lines = input.split('\n').filter(l => l.trim());
        if (lines.length > 0 && /^\s*\{/.test(lines[0])) {
            const arr = [];
            for (const line of lines) {
                try {
                    const obj = JSON.parse(line.trim());
                    if (typeof obj === 'object' && obj !== null) arr.push(obj);
                } catch(e) {}
            }
            if (arr.length > 0) return arr;
        }

        return null;
    }

    /* ============================
       SMART JSON EXTRACTOR
       Handles any structure:
       - [{name, url}]
       - {channels: [{...}]}
       - {"CNN": "http://...", ...}
       - {"CNN": {url: "..."}, ...}
       - Deep nesting
       - Groups / categories
    ============================ */
    function extractFromJSON(data) {
        const results = [];
        const urlRx = /^https?:\/\//i;

        // Priority-ordered key patterns (index 0 = highest priority)
        const NAME_KEYS = [
            'tvg-name','tvg_name','name','title','channel','label','station',
            'channel-name','channel_name','stream_name','display_name','display',
            'epg_name','ch_name','channelname','stream-name','channel_title',
            'program','show','network'
        ];
        const URL_KEYS = [
            'url','link','stream_url','stream','src','source','uri','file',
            'stream_link','hls','m3u8','path','address','dash','mpd',
            'stream_uri','playback','video_url','video','media','content',
            'stream_source','feed','endpoint'
        ];
        const LOGO_KEYS = [
            'logo','tvg-logo','tvg_logo','icon','image','thumbnail',
            'poster','img','cover','avatar','picture','thumb','banner'
        ];
        const IMG_EXT = /\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)([?#]|$)/i;

        function isUrl(v) {
            return typeof v === 'string' && urlRx.test(v.trim());
        }
        function isLogoUrl(key, val) {
            return scoreKey(key, LOGO_KEYS) > 0 || IMG_EXT.test(val);
        }
        function isStreamUrl(key, val) {
            return isUrl(val) && !isLogoUrl(key, val);
        }

        function scoreKey(key, patterns) {
            var lk = (key || '').toLowerCase().replace(/[\s\-_]/g, '');
            for (var i = 0; i < patterns.length; i++) {
                var p = patterns[i].replace(/[\s\-_]/g, '');
                if (lk === p) return 1000 - i;
                if (lk.includes(p)) return 500 - i;
            }
            return -1;
        }

        // Recursively collect all leaf {key, val} pairs from an object
        function flatLeaves(obj, pKey) {
            var out = [];
            if (obj == null) return out;
            if (typeof obj === 'string') {
                out.push({ key: pKey || '', val: obj });
            } else if (Array.isArray(obj)) {
                obj.forEach(function(item) { out = out.concat(flatLeaves(item, pKey)); });
            } else if (typeof obj === 'object') {
                Object.keys(obj).forEach(function(k) {
                    out = out.concat(flatLeaves(obj[k], k));
                });
            }
            return out;
        }

        // From a set of leaves, pick best stream URL + best channel name
        function extractBest(obj, parentKey) {
            var leaves = flatLeaves(obj, '');
            var urls = leaves.filter(function(l) { return isStreamUrl(l.key, l.val); });
            var names = leaves.filter(function(l) {
                return typeof l.val === 'string' && !isUrl(l.val) && l.val.trim().length > 0;
            });

            if (urls.length === 0) return null;

            // Best stream URL by key score
            var bestUrl = urls[0], bestUS = -Infinity;
            urls.forEach(function(u) {
                var s = scoreKey(u.key, URL_KEYS);
                if (s > bestUS) { bestUS = s; bestUrl = u; }
            });

            // Best name by key score
            var bestName = null, bestNS = -Infinity;
            names.forEach(function(n) {
                var s = scoreKey(n.key, NAME_KEYS);
                if (s > bestNS) { bestNS = s; bestName = n.val; }
            });

            return {
                name: (bestName || parentKey || 'Unknown').trim(),
                url: bestUrl.val.trim()
            };
        }

        // Main recursive walker
        function walk(data, parentKey) {
            if (Array.isArray(data)) {
                data.forEach(function(item) { walk(item, parentKey); });
                return;
            }
            if (data === null || typeof data !== 'object') return;

            var keys = Object.keys(data);

            // === Case A: Pure name→URL map ===
            // {"CNN": "http://...", "BBC": "http://...", ...}
            var strKeys = keys.filter(function(k) { return typeof data[k] === 'string'; });
            var urlStrKeys = strKeys.filter(function(k) { return isStreamUrl(k, data[k]); });
            if (urlStrKeys.length > 1 && urlStrKeys.length >= strKeys.length * 0.5 &&
                strKeys.length >= keys.length * 0.7) {
                urlStrKeys.forEach(function(k) {
                    results.push({ name: k, url: data[k].trim() });
                });
                return;
            }

            // === Case B: Single channel object (has direct stream URL) ===
            var hasDirectStreamUrl = keys.some(function(k) {
                return isStreamUrl(k, data[k]);
            });
            if (hasDirectStreamUrl) {
                var entry = extractBest(data, parentKey);
                if (entry) results.push(entry);
                return;
            }

            // === Case C: Container — recurse into children ===
            var beforeLen = results.length;
            keys.forEach(function(k) {
                var val = data[k];
                if (val === null || typeof val !== 'object') return;

                if (Array.isArray(val)) {
                    val.forEach(function(item) { walk(item, k); });
                } else {
                    // Child is an object — check if it has stream URLs
                    var childLeaves = flatLeaves(val, '');
                    var childStreamUrls = childLeaves.filter(function(l) {
                        return isStreamUrl(l.key, l.val);
                    });
                    if (childStreamUrls.length > 0) {
                        if (childStreamUrls.length <= 3) {
                            // Small number of URLs — likely a single channel, use key as name hint
                            var e = extractBest(val, k);
                            if (e) results.push(e);
                        } else {
                            // Many URLs — probably a sub-container, recurse deeper
                            walk(val, k);
                        }
                    }
                }
            });

            // Fallback: if recursion found nothing, try whole object
            if (results.length === beforeLen) {
                var fb = extractBest(data, parentKey);
                if (fb) results.push(fb);
            }
        }

        walk(data, null);
        return results;
    }

    function extractFromM3U(input) {
        var lines = input.split("\n");
        var channels = [];
        var name = "Unknown";

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#EXTINF") === 0) {
                var last = line.lastIndexOf(",");
                name = (last !== -1) ? line.substring(last + 1).trim() : "Unknown";
            } else if (line.indexOf("http") === 0) {
                var link = line.split('?')[0].split('|')[0];
                channels.push({ name: name, url: link });
            }
        }
        return channels;
    }

    function parseJSONData(data) {
        let items = [];
        try {
            const json = JSON.parse(data);
            if (Array.isArray(json)) {
                items = json;
            } else if (json.channels) {
                items = json.channels;
            } else if (json.items) {

    function extractNameAndUrl(line) {
        line = line.trim();
        if (!line) return null;

        if (line.match(/^https?:\/\//i)) {
            return { name: null, url: line };
        }

        const separators = [',', '|', ';', ' - ', ' – ', '\t'];
        for (const sep of separators) {
            if (line.includes(sep)) {
                const parts = line.split(sep).map(s => s.trim());
                const lastPart = parts[parts.length - 1];
                if (lastPart.match(/^https?:\/\//i)) {
                    const name = parts.slice(0, -1).join(' ').trim();
                    return { name: name || null, url: lastPart };
                }
            }
        }

        if (line.match(/^https?:\/\//i)) {
            return { name: null, url: line };
        }

        return null;
    }

    function runTask() {
        const input = document.getElementById('rawInput').value;
        if (!input || !input.trim()) {
            document.getElementById('statusText').textContent = '⚠️ কিছুই পাইনি!';
            return;

                const logo = document.getElementById('logoInput').value.trim() || 'https://imgur.com/79g2kMA.png';
                localStorage.setItem(LOGO_KEY, logo);
                document.getElementById('logoPreview').src = logo;

                const output = ['#EXTM3U'];
                const seen = new Set();
                let count = 0;

                // ===== JSON =====
                if (isJSONFormat(input)) {
                    const items = parseJSONData(input);
                    if (items && items.length > 0) {
                        for (const item of items) {
                            const name = extractNameFromItem(item);
                            let url = extractUrlFromItem(item);
                            
                            if (url && typeof url === 'string') {
                                url = url.split('?')[0].split('|')[0].trim();
                                if (url.startsWith('http') && !seen.has(url)) {
                                    seen.add(url);
                                    const cleanName = name ? cleanNameText(name) : `Channel ${count+1}`;
                                    output.push(`#EXTINF:-1 tvg-logo="${logo}" ,${cleanName}`);
                                    output.push(url);
                                    count++;
                                }
                            }
                        }
                    }
                }

                // ===== M3U / TXT =====
                if (count === 0) {
                    const lines = input.split('\n');
                    let currentName = 'Unknown';

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (!line) continue;

                        if (line.indexOf('#EXTINF') === 0) {
                            const lastComma = line.lastIndexOf(',');
                            if (lastComma !== -1) {
                                let namePart = line.substring(lastComma + 1).trim();
                                if (namePart.includes('|')) namePart = namePart.split('|')[0].trim();
                                if (namePart.includes(',')) namePart = namePart.split(',')[0].trim();
                                currentName = cleanNameText(namePart) || 'Unknown';
                            }
                            continue;
                        }

                        if (line.indexOf('http') === 0) {
                            const cleanUrl = line.split('?')[0].split('|')[0].trim();
                            if (cleanUrl && !seen.has(cleanUrl)) {
                                seen.add(cleanUrl);
                                const displayName = currentName || `Channel ${count+1}`;
                                output.push(`#EXTINF:-1 tvg-logo="${logo}" ,${displayName}`);
                                output.push(cleanUrl);
                                count++;
                            }
                            currentName = 'Unknown';
                            continue;
                        }

                        const parsed = extractNameAndUrl(line);
                        if (parsed && parsed.url) {
                            const cleanUrl = parsed.url.split('?')[0].split('|')[0].trim();
                            if (cleanUrl && !seen.has(cleanUrl)) {
                                seen.add(cleanUrl);
                                let displayName = parsed.name ? cleanNameText(parsed.name) : `Channel ${count+1}`;
                                if (!displayName || displayName === '') displayName = `Channel ${count+1}`;
                                output.push(`#EXTINF:-1 tvg-logo="${logo}" ,${displayName}`);
                                output.push(cleanUrl);
                                count++;
                            }
                        }
                    }
                }

                // ===== শেষ চেষ্টা: শুধু URL =====
                if (count === 0) {
                    const urlRegex = /(https?:\/\/[^\s"']+\.(?:m3u8|ts|mpd|m3u)[^\s"']*)/gi;
                    const matches = input.match(urlRegex);
                    if (matches) {
                        for (const url of matches) {
                            const cleanUrl = url.split('?')[0].split('|')[0].trim();
                            if (!seen.has(cleanUrl)) {
                                seen.add(cleanUrl);
                                output.push(`#EXTINF:-1 tvg-logo="${logo}" ,Stream ${count+1}`);
                                output.push(cleanUrl);
                                count++;
                            }
                        }
                    }
                }

                if (count === 0) {
                    throw new Error('কোনো ভ্যালিড স্ট্রিম লিংক পাওয়া যায়নি!');

                document.getElementById('output').value = output.join('\n');
                document.getElementById('countText').textContent = count + ' টি চ্যানেল';
                document.getElementById('statusText').textContent = '✅ সম্পূর্ণ!';
                document.getElementById('copyBtn').style.display = 'inline-block';
                document.getElementById('downloadBtn').style.display = 'inline-block';

            } catch (e) {
                document.getElementById('statusText').textContent = '❌ Error: ' + e.message;
                document.getElementById('output').value = 'Error: ' + e.message;
            }
            btn.disabled = false;
        }, 50);
    }

    function cleanNameText(text) {
        if (!text) return '';
        let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '').trim();
        cleaned = cleaned.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
        cleaned = cleaned.replace(/\s+/g, ' ');
        cleaned = cleaned.replace(/^[^a-zA-Z0-9\u0980-\u09FF]+/, '').replace(/[^a-zA-Z0-9\u0980-\u09FF]+$/, '');
        return cleaned || '';
    }

    function copyOutput() {
        const target = document.getElementById('output');
        target.select();
        target.setSelectionRange(0, 99999);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        document.getElementById('statusText').textContent = '✅ কপি হয়েছে!';
        setTimeout(() => { document.getElementById('statusText').textContent = '✅ সম্পূর্ণ!'; }, 1500);
    }

    function downloadM3U() {
        const content = document.getElementById('output').value;
        if (!content) return;
        const blob = new Blob([content], { type: 'audio/x-mpegurl' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'playlist_' + new Date().toISOString().slice(0,10) + '.m3u';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        document.getElementById('statusText').textContent = '✅ ডাউনলোড হয়েছে!';
        setTimeout(() => { document.getElementById('statusText').textContent = '✅ সম্পূর্ণ!'; }, 1500);
    }

    function clearAll() {
        if (!confirm('সব ডেটা মুছে ফেলব?')) return;
        document.getElementById('rawInput').value = '';
        document.getElementById('output').value = '';
        document.getElementById('countText').textContent = '০ টি চ্যানেল';
        document.getElementById('statusText').textContent = '🧹 ক্লিয়ার';
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        localStorage.removeItem(STORAGE_KEY);
    }

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            runTask();
        }
    });
</script>
</body>
</html>
